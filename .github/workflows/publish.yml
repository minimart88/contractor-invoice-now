name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the site bundle
        run: |
          set -euo pipefail
          read -r ID SHA < site.txt
          curl -fsSL -o site.zip "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
          echo "${SHA}  site.zip" | sha256sum -c -
          mkdir site
          unzip -q site.zip -d site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
